name: "\U0001F511 Access Request"
description: Request access to a database, dashboard, VPN, or environment.
title: '[Access]: '
labels: []
body:
- type: input
  id: requester
  attributes:
    label: Who needs access?
    description: Name and team of the person who needs it.
  validations:
    required: true
- type: dropdown
  id: access_type
  attributes:
    label: Type of access
    options:
    - Read-only (viewer role)
    - Read/write (loader role)
    - Admin
    - VPN tunnel access
    - "Not sure \u2014 please advise"
  validations:
    required: true
- type: textarea
  id: justification
  attributes:
    label: Business justification
    description: Why is this access needed? Required for audit/security review.
  validations:
    required: true
- type: dropdown
  id: duration
  attributes:
    label: Duration
    options:
    - Permanent / ongoing role
    - "Temporary \u2014 specify end date in justification"
  validations:
    required: true
- type: input
  id: requested_by
  attributes:
    label: Requested by / Stakeholder team
    description: Name and team of the person who is requesting access.
  validations:
    required: true
