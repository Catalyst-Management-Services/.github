name: "\U0001F41B Bug / Data Issue"
description: Report incorrect data, a broken pipeline, a failed job, or unexpected
  behavior.
title: '[Bug]: '
labels: []
body:
- type: textarea
  id: what_happened
  attributes:
    label: What's wrong?
    description: Describe what you saw and what you expected instead.
    placeholder: e.g. The clv_viewer dashboard is showing April numbers even though
      it's supposed to refresh daily.
  validations:
    required: true
- type: textarea
  id: where
  attributes:
    label: Where did you see this?
    description: Table, dashboard name/link, report, pipeline run, etc.
  validations:
    required: true
- type: textarea
  id: acceptance_criteria
  attributes:
    label: What does "fixed" look like?
    placeholder: '- [ ] Dashboard reflects data refreshed within last 24h

      - [ ] Root cause documented in comments

      '
  validations:
    required: true
- type: input
  id: requested_by
  attributes:
    label: Reported by / Stakeholder team
  validations:
    required: true
